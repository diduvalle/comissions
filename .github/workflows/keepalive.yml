# ---------------------------------------------------------------------------
# Keep-alive do Supabase (plano gratuito)
#
# Porquê: no plano gratuito, o projeto Supabase é PAUSADO ao fim de 7 dias
# "sem atividade". Em 23/11/2026 foi pausado MESMO com uma leitura diária de
# 1 linha, por isso este workflow agora faz o que a app faz:
#   1. uma leitura real (comissões com cliente e produto);
#   2. uma ESCRITA na tabela "keepalive" (atividade inequívoca);
#   3. corre DUAS vezes por dia.
# Há uma 2.ª origem independente: o Vercel Cron chama /api/keepalive 1x/dia.
#
# Se algo falhar (projeto pausado, erro), o passo FALHA de propósito e o
# GitHub envia-te um email "workflow failed" -> serve de ALERTA.
#
# Sem secrets: a chave "publishable" já é pública (está no frontend da app).
# Disparo: automático e manual (botão "Run workflow" no separador Actions).
# ---------------------------------------------------------------------------

name: keep-alive-supabase

on:
  schedule:
    # 06:17 e 18:17 UTC (o cron do GitHub é sempre UTC e pode atrasar)
    - cron: '17 6,18 * * *'
  workflow_dispatch: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ler e escrever na base de dados (falha se não responder)
        run: |
          KEY="sb_publishable_eKHXqa4aW7SwV8zx_euepA_ngZ3U5NU"
          SB="https://bhurcadussdjohbngekq.supabase.co/rest/v1"

          # 1. leitura como a app faz (comissões + cliente + produto)
          LER=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            "${SB}/comissoes?select=id,valor_venda,cliente:clientes(nome),produto:produtos(tipo)&order=updated_at.desc&limit=20")
          echo "Leitura: HTTP ${LER}"

          # 2. escrita: atualiza a hora do último ping
          AGORA=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ESC=$(curl -s -o /tmp/esc.json -w "%{http_code}" --retry 3 --retry-delay 20 -X PATCH \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"ultimo\":\"${AGORA}\"}" \
            "${SB}/keepalive?origem=eq.github")
          echo "Escrita: HTTP ${ESC} $(cat /tmp/esc.json)"

          if [ "${LER}" != "200" ]; then
            echo "::error::Keep-alive falhou - a leitura devolveu HTTP ${LER} (projeto pausado?)."
            exit 1
          fi
          if [ "${ESC}" != "200" ] || ! grep -q '"origem"' /tmp/esc.json; then
            echo "::error::Keep-alive: a escrita falhou (HTTP ${ESC}). Correu o criar-keepalive.sql no Supabase?"
            exit 1
          fi
          echo "Keep-alive OK - leitura e escrita feitas."
